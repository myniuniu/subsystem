<!DOCTYPE html>
<html>
<head>
    <title>清除localStorage</title>
</head>
<body>
    <h1>清除localStorage数据</h1>
    <button onclick="clearStorage()">清除数据</button>
    <div id="result"></div>
    
    <script>
        function clearStorage() {
            try {
                localStorage.clear();
                document.getElementById('result').innerHTML = '<p style="color: green;">localStorage已清除，请刷新主应用页面</p>';
                console.log('localStorage已清除');
            } catch (e) {
                document.getElementById('result').innerHTML = '<p style="color: red;">清除失败: ' + e.message + '</p>';
                console.error('清除失败:', e);
            }
        }
        
        // 显示当前localStorage内容
        console.log('当前localStorage内容:');
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            console.log(key + ':', localStorage.getItem(key));
        }
    </script>
</body>
</html>
